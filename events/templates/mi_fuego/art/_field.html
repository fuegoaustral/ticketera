<div class="mb-3{% if field.errors %} has-error{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <div class="form-check">
            {{ field }}
            <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        </div>
    {% else %}
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.field.widget.allow_multiple_selected %}<div class="image-selection-preview" data-image-selection-preview aria-live="polite"></div>{% endif %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
