{# El estado de la beca al lado del de la inscripción, sólo si la propuesta empezó a pedirla. #}
{% if artwork.grant_started %}{% with status=artwork.grant_status %}<span class="badge text-nowrap border" style="{% if artwork.grant_incomplete or status == 'info' %}background:#fff4d6;color:#6b4a00 !important;border-color:#f0d58a !important{% elif status == 'pending' %}background:#e7f1fb;color:#0b4a7d !important;border-color:#b6d4f0 !important{% elif status == 'rejected' %}background:#fbe9eb;color:#8a1c28 !important;border-color:#f1c0c6 !important{% else %}background:#e6f4ec;color:#146c43 !important;border-color:#b3dcc4 !important{% endif %}"><i class="fas fa-hand-holding-usd me-1" aria-hidden="true"></i>Beca · {% if status == 'pending' %}Presentada{% else %}{{ artwork.grant_status_label }}{% endif %}</span>{% endwith %}{% endif %}
