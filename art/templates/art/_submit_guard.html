<script>
    // Un envío por vez: en un teléfono lento cada toque extra en "Guardar" mandaba el formulario de nuevo
    // (y el alta creaba la obra repetida). Al enviar se desactivan los botones del formulario y el que se
    // tocó dice "Guardando…". El name/value del botón (por ejemplo action=beca) viaja en un campo oculto,
    // porque un botón desactivado no se envía. Volver atrás (bfcache) o un envío que no salió (por
    // ejemplo, si se cancela el aviso de salir de la página) los vuelve a activar.
    (function () {
        const LABEL = 'Guardando…';
        const RELEASE_AFTER_MS = 30000;
        const pending = new Set();

        const submitButtons = function (form) {
            return Array.from(form.elements).filter(function (element) {
                return (element.tagName === 'BUTTON' || element.tagName === 'INPUT') && element.type === 'submit';
            });
        };

        const release = function (form) {
            if (!pending.has(form)) return;
            pending.delete(form);
            clearTimeout(form._submitGuardTimer);
            delete form.dataset.submitting;
            form.removeAttribute('aria-busy');
            form.querySelectorAll('input[data-submit-guard]').forEach(function (input) { input.remove(); });
            (form._submitGuardDisabled || []).forEach(function (element) {
                element.disabled = false;
                if ('guardLabel' in element.dataset) {
                    if (element.tagName === 'INPUT') element.value = element.dataset.guardLabel;
                    else element.innerHTML = element.dataset.guardLabel;
                    delete element.dataset.guardLabel;
                }
            });
            form._submitGuardDisabled = [];
        };

        document.addEventListener('submit', function (event) {
            const form = event.target;
            if (event.defaultPrevented || form.method.toLowerCase() !== 'post') return;
            if (form.target && form.target !== '_self') return;
            if (form.dataset.submitting) {
                event.preventDefault();
                return;
            }
            form.dataset.submitting = '1';
            form.setAttribute('aria-busy', 'true');
            pending.add(form);

            const submitter = event.submitter;
            if (submitter && submitter.name) {
                const hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.name = submitter.name;
                hidden.value = submitter.value;
                hidden.dataset.submitGuard = '';
                form.appendChild(hidden);
            }

            const buttons = submitButtons(form);
            const disabled = buttons.filter(function (button) { return !button.disabled; });
            // El texto cambia en el botón tocado (o en el primero, si se envió con Enter); los de sólo ícono
            // (eliminar) quedan como están.
            const labelled = (submitter && buttons.indexOf(submitter) !== -1) ? submitter : buttons[0];
            if (labelled) {
                if (labelled.tagName === 'INPUT') {
                    labelled.dataset.guardLabel = labelled.value;
                    labelled.value = LABEL;
                } else if (labelled.textContent.trim()) {
                    labelled.dataset.guardLabel = labelled.innerHTML;
                    labelled.textContent = LABEL;
                }
            }
            disabled.forEach(function (button) { button.disabled = true; });
            // Formularios sin botón (subir al elegir archivo, interruptores): sus campos se desactivan
            // después de armar el envío, para no sacarlos de lo que se manda.
            let fields = [];
            if (!buttons.length) {
                fields = Array.from(form.elements).filter(function (element) {
                    return element.type !== 'hidden' && !element.disabled && 'disabled' in element;
                });
                setTimeout(function () {
                    if (!pending.has(form)) return;
                    fields.forEach(function (field) { field.disabled = true; });
                }, 0);
            }
            form._submitGuardDisabled = disabled.concat(fields);
            form._submitGuardTimer = setTimeout(function () { release(form); }, RELEASE_AFTER_MS);
        });

        window.addEventListener('pageshow', function () {
            Array.from(pending).forEach(release);
        });
    }());
</script>
