{% comment %}Fotos del checkout. En ESTAFA (estafa_view), borrar vuelve a la revisión.{% endcomment %}
{% if checkout_photos %}
<div class="row g-3">
    {% for photo in checkout_photos %}
    <div class="col-6 col-lg-4">
        <figure class="gallery-card mb-0">
            <a href="{{ photo.image.url }}" target="_blank" rel="noopener"><img src="{{ photo.image.url }}" alt="{{ photo.caption|default:'Foto de checkout' }}" loading="lazy"></a>
            {% if photo.caption %}<figcaption class="p-2 small">{{ photo.caption }}</figcaption>{% endif %}
            {% if can_delete %}<form class="artwork-file-delete" method="post" action="{% url 'artwork_checkout_photo_delete' artwork.pk photo.pk %}">{% csrf_token %}{% if estafa_view %}<input type="hidden" name="return_to" value="review">{% endif %}<button type="submit" title="Eliminar foto" aria-label="Eliminar foto" onclick="return confirm('¿Eliminar esta foto?')"><i class="fas fa-trash" aria-hidden="true"></i></button></form>{% endif %}
        </figure>
    </div>
    {% endfor %}
</div>
{% else %}<p class="small text-muted mb-0">{{ empty }}</p>{% endif %}
