{% with stage=artwork.stage %}<span class="badge text-wrap text-start border" style="{% if stage == 'pending' or stage == 'checkout' %}background:#e7f1fb;color:#0b4a7d !important;border-color:#b6d4f0 !important{% elif stage == 'checkout_pending' %}background:#fff4d6;color:#6b4a00 !important;border-color:#f0d58a !important{% elif stage == 'rejected' %}background:#fbe9eb;color:#8a1c28 !important;border-color:#f1c0c6 !important{% else %}background:#e6f4ec;color:#146c43 !important;border-color:#b3dcc4 !important{% endif %}"><i class="fas {% if stage == 'pending' %}fa-hourglass-half{% elif stage == 'active' %}fa-circle-check{% elif stage == 'checkout_pending' %}fa-broom{% elif stage == 'checkout' %}fa-paper-plane{% elif stage == 'verified' %}fa-check-double{% else %}fa-circle-xmark{% endif %} me-1" aria-hidden="true"></i>{{ artwork.stage_label }}</span>{% endwith %}
